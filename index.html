<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>家务军功榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="appShell">
    <header>
        <h1>家务军功榜</h1>
        <div class="scale-control">
            <button class="scale-btn" onclick="adjustAppScale(-5)" aria-label="缩小">-</button>
            <button class="scale-value" id="scaleValue" onclick="setAppScale(100)">100%</button>
            <button class="scale-btn" onclick="adjustAppScale(5)" aria-label="放大">+</button>
        </div>
    </header>

    <div id="dashboard">
        <!-- 功勋卡片 -->
        <div class="merit-summary">
            <!-- 特等功 -->
            <div class="merit-card special">
                <div class="merit-count" id="count-special">0</div>
                <div class="merit-label">特等功</div>
                <div class="merit-footer">
                    <div class="next-level-progress">终极荣誉</div>

                </div>
            </div>

            <!-- 一等功 -->
            <div class="merit-card first">
                <div class="merit-count" id="count-first">0</div>
                <div class="merit-label">一等功</div>

                    <div class="next-level-progress" id="progress-first">差3 个一等功 可兑换 特等功</div>


            </div>

            <!-- 二等功 -->
            <div class="merit-card second">
                <div class="merit-count" id="count-second">0</div>
                <div class="merit-label">二等功</div>
                <div class="next-level-progress" id="progress-second">差5 个二等功 可兑换 一等功</div>
            </div>

            <!-- 三等功 -->
            <div class="merit-card third">
                <div class="merit-count" id="count-third">0</div>
                <div class="merit-label">三等功</div>
                <div class="next-level-progress" id="progress-third">差10 个三等功 可兑换 二等功</div>
            </div>
        </div>

        <div class="total-banner">
            军功总值: <strong id="total-merits">0</strong> (折合三等功)
        </div>

        <!-- 操作区 -->
        <div class="action-grid">
            <div class="action-btn primary" onclick="showModal('completeTaskModal')">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                </svg>
                <span>完成家务 (领赏)</span>
            </div>

            <div class="action-btn" onclick="openRedeem()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M20 7h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35L12 5.02l-.5-.67C10.96 3.54 10.05 3 9 3 7.34 3 6 4.34 6 6c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 20c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V9c0-1.11-.89-2-2-2zM15 5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V9h5.08L7 11.83 8.62 13 12 8.4l3.38 4.6L17 11.83 14.92 9H20v6z" />
                </svg>
                <span>兑换功勋</span>
            </div>

            <div class="action-btn" onclick="showModal('historyModal')">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.14.72-1.21-3.5-1.75V8H12z" />
                </svg>
                <span>积分历史</span>
            </div>

            <div class="action-btn" onclick="showModal('manageModal')">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                </svg>
                <span>家务管理</span>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->

    <!-- 完成家务弹窗 -->
    <div id="completeTaskModal" class="modal">
        <div class="modal-header">
            <h2 class="modal-title">选择已完成任务</h2>
            <button class="close-btn" onclick="closeModal('completeTaskModal')">&times;</button>
        </div>
        <div class="modal-content" id="taskList"></div>
    </div>

    <!-- 历史记录弹窗 -->
    <div id="historyModal" class="modal">
        <div class="modal-header">
            <h2 class="modal-title">历史记录</h2>
            <button class="close-btn" onclick="closeModal('historyModal')">&times;</button>
        </div>
        <div class="modal-content">
            <div class="io-toolbar">
                <button class="io-btn" onclick="exportHistory()">导出记录</button>
                <button class="io-btn" onclick="triggerImport('history')">导入记录</button>
            </div>
            <div id="historyList"></div>
            <div style="padding: 20px 0; text-align: center;">
                <button class="io-btn" style="color:var(--danger-color); width: 100%; border-color: rgba(220, 38, 38, 0.2); background: rgba(220, 38, 38, 0.05);" onclick="clearAllHistory()">一键删除所有历史记录</button>
            </div>
        </div>
    </div>

    <!-- 家务管理弹窗 -->
    <div id="manageModal" class="modal">
        <div class="modal-header">
            <h2 class="modal-title">家务管理</h2>
            <button class="close-btn" onclick="closeModal('manageModal')">&times;</button>
        </div>

        <div class="modal-content">
            <div class="io-toolbar">
                <button class="io-btn" onclick="exportTasks()">导出配置</button>
                <button class="io-btn" onclick="triggerImport('tasks')">导入配置</button>
            </div>

            <div class="add-task-form">
                <label class="form-label" id="form-title">添加新家务</label>
                <input type="text" id="newTaskName" class="form-input" placeholder="输入家务名称">

                <label class="form-label">奖励数量 (三等功)</label>
                <div class="counter-input">
                    <button class="counter-btn" onclick="adjustReward(-1)">-</button>
                    <input type="number" id="newTaskReward" class="counter-value counter-value-input" value="2" min="1" inputmode="numeric">
                    <button class="counter-btn" onclick="adjustReward(1)">+</button>
                </div>

                <div class="task-form-actions">
                    <button class="btn-primary-main" id="saveTaskBtn" onclick="saveNewOrEditedTask()">保存</button>
                    <button class="btn-primary-main" id="saveAndRecordTaskBtn" onclick="saveAndRecordTask()">保存并记录</button>
                    <button class="io-btn task-form-cancel" onclick="resetTaskForm()">取消</button>
                </div>
            </div>

            <div id="manageTaskList"></div>
        </div>
    </div>

    <input type="file" id="importInput" style="display: none" accept=".json">

    <!-- 兑换弹窗 -->
    <div id="redeemModal" class="modal">
        <div class="modal-header">
            <h2 class="modal-title">兑换军功奖励</h2>
            <button class="close-btn" onclick="closeModal('redeemModal')">&times;</button>
        </div>
        <div class="modal-content">
            <div class="add-task-form">
                <p id="redeemInfo" style="margin-bottom: 20px; color: var(--text-secondary); font-size: 15px; font-weight: 700; text-align: center;"></p>
                <label class="form-label">消耗功勋类型</label>
                <div class="redeem-rank-options" id="redeemRankOptions"></div>
                <label class="form-label">消耗数量</label>
                <div class="redeem-count-input">
                    <button class="counter-btn" onclick="adjustRedeemCount(-1)">-</button>
                    <span class="counter-value" id="redeemCount">1</span>
                    <button class="counter-btn" onclick="adjustRedeemCount(1)">+</button>
                </div>
                <label class="form-label">想要兑换的内容</label>
                <input type="text" id="redeemContent" class="form-input" placeholder="例如：大餐一顿、新游戏、休息一天...">

                <button class="btn-primary-main" style="width: 100%;" onclick="confirmRedeem()">确定兑换</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast">太棒了！继续加油！</div>
    </div>

    <script src="app.js"></script>
</body>

</html>
